{{/* Hextra layout structure (MIT); source Markdown owns the single visible H1. */}}
<div class="docs-layout hx:mx-auto hx:flex hextra-max-page-width">
  {{ partial "sidebar.html" (dict "context" .) }}
  {{ partial "toc.html" . }}
  <article class="hx:w-full hx:break-words hx:flex hx:min-w-0 hx:justify-center hx:pb-8">
    <main id="content" class="hx:w-full hx:min-w-0 hextra-max-content-width hx:px-6 hx:pt-4 hx:md:px-12">
      {{ partial "breadcrumb.html" (dict "page" . "enable" true) }}
      <div class="content">{{ .Content }}</div>
      {{ partial "components/pager.html" . }}
    </main>
  </article>
</div>
