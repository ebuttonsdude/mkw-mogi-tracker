[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mkw-mogi-tracker"
version = "0.1.0"
description = "Local Mario Kart World player/team scoring and OBS capture review"
license = {file = "COPYING.md"}
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mkw-tracker = "mkw_tracker.__main__:main"

[project.optional-dependencies]
capture = ["websocket-client==1.9.2", "opencv-python-headless>=4.10,<6"]
reports = ["Pillow>=10.4,<14"]

[tool.setuptools.packages.find]
include = ["mkw_tracker*"]

[tool.setuptools]
license-files = ["LICENSE", "COPYING.md", "ATTRIBUTION.md", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]

[tool.setuptools.package-data]
mkw_tracker = ["static/*.html", "static/*.css", "static/*.js", "profiles/*.json"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
